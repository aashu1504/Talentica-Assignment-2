# VAmPI API Discovery Configuration
# This file contains configurable paths, patterns, and settings for API discovery

# Common API paths to scan (VAMPI-SPECIFIC ONLY)
common_paths:
  - "/users/v1"
  - "/users/v1/register"
  - "/users/v1/login"
  - "/users/v1/_debug"
  - "/users/v1/{user_id}"
  - "/users/v1/{user_id}/email"
  - "/users/v1/{user_id}/password"
  - "/books/v1"
  - "/books/v1/{book_title}"
  - "/"
  - "/createdb"
  - "/me"
  # Remove API version variations that don't exist in VAmPI
  # - "/api/v1"                    # ❌ Not in VAmPI
  # - "/api/v1/users"              # ❌ Not in VAmPI
  # - "/api/v1/books"              # ❌ Not in VAmPI
  # - "/v1"                        # ❌ Not in VAmPI
  # - "/v1/users"                  # ❌ Not in VAmPI
  # - "/v1/books"                  # ❌ Not in VAmPI

